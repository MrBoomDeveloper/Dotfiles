# cava config for the BoomDeskidgets music visualizer.
# Raw ASCII output: one frame per line, ';'-separated values in 0..1000.

[general]
framerate = 60
bars = 100

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
channels = mono

[smoothing]
noise_reduction = 77
monstercat = 1
gravity = 120
